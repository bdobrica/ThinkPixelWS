name: thinkpixelws

services:
  postgres:
    image: postgres:17.6-alpine3.21@sha256:849377bbbdb1143b82d1b87646eb8ab48241fe32b85ab6667e02e0af139aaa74
    environment:
      POSTGRES_DB: thinkpixelws
      POSTGRES_PASSWORD: ${THINKPIXELWS_DEV_POSTGRES_PASSWORD:-thinkpixelws-local-only}
      POSTGRES_USER: thinkpixelws_migrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkpixelws_migrator -d thinkpixelws"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${THINKPIXELWS_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://thinkpixelws_migrator:${THINKPIXELWS_DEV_POSTGRES_PASSWORD:-thinkpixelws-local-only}@postgres:5432/thinkpixelws?sslmode=disable
      - up

volumes:
  postgres-data:
